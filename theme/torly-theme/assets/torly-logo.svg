<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Icon: Abstract T + AI concept with geometric shapes -->
  <g id="icon">
    <!-- Outer circle/ring -->
    <circle cx="30" cy="30" r="20" stroke="#FF6B35" stroke-width="2.5" fill="none"/>

    <!-- Inner geometric T shape -->
    <path d="M20 18 L40 18 L40 22 L32 22 L32 42 L28 42 L28 22 L20 22 Z" fill="#FF6B35"/>

    <!-- AI dots/nodes -->
    <circle cx="23" cy="32" r="2" fill="#FF6B35"/>
    <circle cx="37" cy="32" r="2" fill="#FF6B35"/>
    <circle cx="30" cy="38" r="2" fill="#FF6B35"/>

    <!-- Connection lines (neural network style) -->
    <line x1="23" y1="32" x2="30" y2="38" stroke="#FF6B35" stroke-width="1.5" opacity="0.6"/>
    <line x1="37" y1="32" x2="30" y2="38" stroke="#FF6B35" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Text: Torly AI -->
  <g id="text">
    <text x="60" y="35" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#1F2937">
      Torly
    </text>
    <text x="115" y="35" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="300" fill="#6B7280">
      AI
    </text>
  </g>

  <!-- Tagline (optional, can be used in larger formats) -->
  <text x="60" y="48" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="400" fill="#9CA3AF" letter-spacing="0.5">
    UK INNOVATOR VISA ASSISTANT
  </text>
</svg>
