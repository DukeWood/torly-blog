<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F9FAFB"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#FF6B35" opacity="0.1"/>
  <circle cx="1100" cy="530" r="120" fill="#FF6B35" opacity="0.1"/>

  <!-- UK Flag Icon (stylized) -->
  <g transform="translate(150, 150)">
    <rect width="180" height="120" rx="8" fill="#1F2937"/>
    <path d="M0 0 L180 120 M180 0 L0 120" stroke="white" stroke-width="12"/>
    <path d="M0 0 L180 120 M180 0 L0 120" stroke="#FF6B35" stroke-width="6"/>
    <rect x="75" y="0" width="30" height="120" fill="white"/>
    <rect x="0" y="45" width="180" height="30" fill="white"/>
    <rect x="80" y="0" width="20" height="120" fill="#FF6B35"/>
    <rect x="0" y="50" width="180" height="20" fill="#FF6B35"/>
  </g>

  <!-- Document/Passport Icon -->
  <g transform="translate(400, 180)">
    <rect width="140" height="180" rx="8" fill="#4B5563" opacity="0.9"/>
    <rect x="15" y="20" width="110" height="25" rx="4" fill="white" opacity="0.9"/>
    <rect x="15" y="55" width="80" height="8" rx="2" fill="white" opacity="0.7"/>
    <rect x="15" y="70" width="100" height="8" rx="2" fill="white" opacity="0.7"/>
    <circle cx="70" cy="120" r="25" fill="#FF6B35"/>
    <path d="M70 110 L70 120 L80 120" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Innovation lightbulb -->
  <g transform="translate(650, 160)">
    <circle cx="60" cy="60" r="40" fill="#FCD34D"/>
    <rect x="45" y="95" width="30" height="35" rx="4" fill="#6B7280"/>
    <line x1="20" y1="60" x2="0" y2="60" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="60" x2="120" y2="60" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="35" x2="20" y2="20" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
    <line x1="85" y1="35" x2="100" y2="20" stroke="#FF6B35" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Upward arrow (growth) -->
  <g transform="translate(850, 200)">
    <path d="M40 120 L40 20 M40 20 L20 40 M40 20 L60 40" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <rect x="10" y="125" width="60" height="8" rx="2" fill="#10B981" opacity="0.3"/>
  </g>

  <!-- Title -->
  <text x="150" y="380" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" fill="#1F2937">
    UK Innovator Visa 2026
  </text>
  <text x="150" y="440" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="42" font-weight="400" fill="#6B7280">
    Complete Guide for Entrepreneurs
  </text>

  <!-- Decorative line -->
  <rect x="150" y="470" width="120" height="6" rx="3" fill="#FF6B35"/>

  <!-- Bottom tag -->
  <g transform="translate(150, 520)">
    <rect width="200" height="50" rx="25" fill="#FF6B35" opacity="0.1"/>
    <text x="25" y="33" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#FF6B35">
      TorlyAI Guide
    </text>
  </g>
</svg>
