<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F3F4F6"/>

  <!-- Decorative elements -->
  <circle cx="1050" cy="100" r="180" fill="#3B82F6" opacity="0.08"/>
  <circle cx="150" cy="550" r="100" fill="#FF6B35" opacity="0.1"/>

  <!-- Document stack -->
  <g transform="translate(180, 120)">
    <!-- Back document -->
    <rect x="20" y="20" width="250" height="320" rx="8" fill="#9CA3AF" opacity="0.3"/>
    <!-- Middle document -->
    <rect x="10" y="10" width="250" height="320" rx="8" fill="#6B7280" opacity="0.4"/>
    <!-- Front document -->
    <rect width="250" height="320" rx="8" fill="white" stroke="#E5E7EB" stroke-width="2"/>

    <!-- Document lines -->
    <rect x="25" y="30" width="80" height="12" rx="2" fill="#FF6B35"/>
    <rect x="25" y="60" width="200" height="8" rx="2" fill="#D1D5DB"/>
    <rect x="25" y="80" width="180" height="8" rx="2" fill="#D1D5DB"/>
    <rect x="25" y="100" width="190" height="8" rx="2" fill="#D1D5DB"/>

    <!-- Chart on document -->
    <g transform="translate(25, 140)">
      <rect width="200" height="120" fill="#F9FAFB" rx="4"/>
      <!-- Bar chart -->
      <rect x="20" y="80" width="30" height="30" fill="#3B82F6" opacity="0.6"/>
      <rect x="60" y="60" width="30" height="50" fill="#10B981" opacity="0.6"/>
      <rect x="100" y="40" width="30" height="70" fill="#FF6B35" opacity="0.8"/>
      <rect x="140" y="20" width="30" height="90" fill="#F59E0B" opacity="0.6"/>
    </g>
  </g>

  <!-- Pen/writing icon -->
  <g transform="translate(520, 180)">
    <path d="M10 110 L30 90 L90 30 L110 50 L50 110 Z" fill="#1F2937"/>
    <path d="M90 30 L110 50 L120 40 L100 20 Z" fill="#FF6B35"/>
    <circle cx="105" cy="35" r="8" fill="#FCD34D"/>
    <path d="M10 110 L30 90 L10 120 Z" fill="#6B7280"/>
  </g>

  <!-- Checklist -->
  <g transform="translate(700, 160)">
    <rect width="280" height="240" rx="12" fill="white" stroke="#E5E7EB" stroke-width="2"/>

    <!-- Checkmark items -->
    <circle cx="30" cy="40" r="12" fill="#10B981"/>
    <path d="M25 40 L28 43 L35 36" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="55" y="34" width="200" height="12" rx="2" fill="#D1D5DB"/>

    <circle cx="30" cy="85" r="12" fill="#10B981"/>
    <path d="M25 85 L28 88 L35 81" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="55" y="79" width="180" height="12" rx="2" fill="#D1D5DB"/>

    <circle cx="30" cy="130" r="12" fill="#10B981"/>
    <path d="M25 130 L28 133 L35 126" stroke="white" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="55" y="124" width="160" height="12" rx="2" fill="#D1D5DB"/>

    <circle cx="30" cy="175" r="12" fill="#E5E7EB"/>
    <rect x="55" y="169" width="190" height="12" rx="2" fill="#E5E7EB"/>
  </g>

  <!-- Title -->
  <text x="150" y="480" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="52" font-weight="700" fill="#1F2937">
    Winning Business Plan
  </text>
  <text x="150" y="535" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="400" fill="#6B7280">
    for UK Innovator Visa
  </text>

  <!-- Decorative line -->
  <rect x="150" y="560" width="100" height="5" rx="2.5" fill="#3B82F6"/>
</svg>
